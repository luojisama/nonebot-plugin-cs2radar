name: Security checks

on:
  push:
    branches: [main, "security/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.10"
            pydantic-spec: "pydantic<2"
          - python-version: "3.12"
            pydantic-spec: "pydantic>=2,<3"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Upgrade bootstrap packaging tools
        run: python -m pip install --upgrade "pip>=26.0.1" "setuptools>=83.0.0"
      - name: Install test and audit tools
        run: python -m pip install '.[test]' '${{ matrix.pydantic-spec }}' bandit==1.9.4 pip-audit==2.10.0
      - name: Compile
        run: python -m compileall -q nonebot_plugin_cs2radar
      - name: Tests
        run: pytest -q
      - name: Static security scan
        run: bandit -r nonebot_plugin_cs2radar -ll
      - name: Dependency audit
        run: pip-audit
